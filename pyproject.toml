[build-system]
requires = ["setuptools>=78", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "longcap"
version = "0.1.0rc4"
description = "LongCap: hour-scale timestamped audio captioning and speech diarization with a custom vLLM server"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "docs/THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.12,<3.13"
authors = [{ name = "The LongCap authors" }]
keywords = ["audio captioning", "timestamped audio captioning", "speaker diarization", "speech recognition", "long-form audio", "vllm"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Sound/Audio :: Analysis",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy==2.3.5", "soundfile==0.14.0", "httpx==0.28.1",
  "transformers==5.14.1", "tokenizers==0.22.2",
]

[project.optional-dependencies]
server = [
  "vllm==0.26.0", "torch==2.11.0+cu130", "torchaudio==2.11.0+cu130",
  "torchvision==0.26.0", "safetensors==0.8.0", "fastapi==0.136.3",
  "uvicorn==0.52.1", "flashinfer-python==0.6.14", "triton==3.6.0",
  "python-multipart==0.0.32",
]
test = ["pytest==8.1.1", "fastapi==0.136.3", "python-multipart==0.0.32"]

[project.urls]
Homepage = "https://jctian98.github.io/longcap/"
Repository = "https://github.com/jctian98/longcap-code"
Documentation = "https://github.com/jctian98/longcap-code/blob/main/docs/quickstart.md"
"Model (FP8)" = "https://huggingface.co/JinchuanTian/LongCap-35B-A3B-FP8"
"Model (BF16)" = "https://huggingface.co/JinchuanTian/LongCap-35B-A3B"

[project.scripts]
longcap = "longcap.cli:main"

[project.entry-points."vllm.general_plugins"]
longcap_speechlm_captioner = "espnet2.speechlm.vllm.vllm_server.plugin:register"

[tool.setuptools.packages.find]
where = ["src"]
include = ["longcap*", "espnet2.speechlm.vllm*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
