[build-system]
requires = ["setuptools>=78", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "longcap"
version = "0.1.0"
description = "LongCap 35B-A3B audio captioning client and custom vLLM service"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "docs/THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy==2.3.5", "soundfile==0.14.0", "httpx==0.28.1",
  "transformers==5.14.1", "tokenizers==0.22.2",
]

[project.optional-dependencies]
server = [
  "vllm==0.26.0", "torch==2.11.0+cu130", "torchaudio==2.11.0+cu130",
  "torchvision==0.26.0", "safetensors==0.8.0", "fastapi==0.136.3",
  "uvicorn==0.52.1", "flashinfer-python==0.6.14", "triton==3.6.0",
  "python-multipart==0.0.32",
]
test = ["pytest>=7"]

[project.scripts]
longcap = "longcap.cli:main"

[project.entry-points."vllm.general_plugins"]
longcap_speechlm_captioner = "espnet2.speechlm.vllm.vllm_server.plugin:register"

[tool.setuptools.packages.find]
where = ["src"]
include = ["longcap*", "espnet2.speechlm.vllm*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
